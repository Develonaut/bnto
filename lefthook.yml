pre-commit:
  parallel: false
  commands:
    wasm-codegen:
      glob: "engine/**/*.{rs,toml}"
      priority: 1
      run: task wasm:codegen && git add apps/web/public/wasm/bnto_wasm.js apps/web/public/wasm/bnto_wasm_bg.wasm engine/catalog.snapshot.json packages/@bnto/nodes/src/generated/ packages/@bnto/nodes/docs/ packages/@bnto/backend/convex/_helpers/nodeTypeLabels.ts packages/@bnto/i18n/src/generated/nodes.json
      stage_fixed: true

    rust-fmt:
      glob: "engine/**/*.rs"
      priority: 2
      run: cd engine && cargo fmt
      stage_fixed: true

    rust-test:
      glob: "engine/**/*.{rs,toml}"
      priority: 3
      run: cd engine && cargo test --workspace

    prettier:
      glob: "*.{ts,tsx,js,mjs,json,css,md,yml,yaml}"
      priority: 4
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    lint:
      glob: "*.{ts,tsx,js,mjs}"
      exclude: "^(archive/|engine/|node_modules/|\\.next)"
      run: pnpm turbo run lint

    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm turbo run build

    dead-code:
      glob: "*.{ts,tsx}"
      run: pnpm knip --no-progress

    sherif:
      glob: "**/package.json"
      run: pnpm sherif -p @bnto/package.json

    check-object-assign:
      glob: "*.tsx"
      run: |
        if grep -rn 'Object\.assign' {staged_files} 2>/dev/null; then
          echo "ERROR: Object.assign compound patterns break RSC. Use flat named exports."
          exit 1
        fi

    check-grab-bags:
      glob: "*.{ts,tsx}"
      exclude: "(node_modules/|engine/|\\.next|e2e/)"
      run: |
        for f in {staged_files}; do
          base=$(basename "$f")
          if echo "$base" | grep -qE '^(utils|helpers|hooks)\.(ts|tsx)$'; then
            echo "ERROR: Grab-bag filename detected: $f"
            exit 1
          fi
        done

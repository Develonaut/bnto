pre-commit:
  parallel: false
  commands:
    nodes-codegen:
      glob: "engine/**/*.{rs,toml}"
      priority: 1
      # Regenerates the catalog and TS node files only. The committed WASM
      # bundle is a release build and changes only on purpose (`task wasm:deploy`).
      run: task nodes:codegen && git add engine/catalog.snapshot.json packages/@bnto/nodes/src/generated/ packages/@bnto/nodes/docs/ packages/@bnto/backend/convex/_helpers/nodeTypeLabels.ts packages/@bnto/i18n/src/generated/nodes.json
      stage_fixed: true

    nodes-test:
      glob: "engine/**/*.{rs,toml}"
      priority: 2
      run: pnpm --filter @bnto/nodes test

    docs-validate:
      glob: "engine/**/*.{rs,toml}"
      priority: 3
      run: pnpm exec tsx scripts/validate-docs.ts

    # Same script: it also checks every relative Markdown link (ISS-20).
    docs-links:
      glob: "*.md"
      priority: 3
      run: pnpm exec tsx scripts/validate-docs.ts

    rust-fmt:
      glob: "engine/**/*.rs"
      priority: 4
      run: cd engine && cargo fmt
      stage_fixed: true

    theme-codegen:
      glob: "theme/palette.toml"
      priority: 1
      run: task theme:generate && git add apps/web/app/theme-colors.generated.css engine/crates/bnto/src/tui/palette.rs
      stage_fixed: true

    prettier:
      glob: "*.{ts,tsx,js,mjs,json,css,md,yml,yaml}"
      priority: 4
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    lint:
      glob: "*.{ts,tsx,js,mjs}"
      exclude:
        - "archive/**"
        - "engine/**"
        - "**/node_modules/**"
        - "**/.next/**"
      run: pnpm turbo run lint

    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm turbo run build

    dead-code:
      glob: "*.{ts,tsx}"
      run: pnpm knip --no-progress

    sherif:
      glob: "**/package.json"
      run: pnpm sherif -p @bnto/package.json

    # Multi-line `run:` scripts break on Windows, where lefthook passes them
    # to `sh -c` inside double quotes; keep shell logic in scripts/hooks/.
    check-object-assign:
      glob: "*.tsx"
      run: sh scripts/hooks/check-object-assign.sh {staged_files}

    check-grab-bags:
      glob: "*.{ts,tsx}"
      exclude:
        - "**/node_modules/**"
        - "engine/**"
        - "**/.next/**"
        - "**/e2e/**"
      run: sh scripts/hooks/check-grab-bags.sh {staged_files}

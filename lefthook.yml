pre-commit:
  parallel: false
  commands:
    wasm-codegen:
      glob: "engine/**/*.{rs,toml}"
      run: task wasm:codegen && git add apps/web/public/wasm/bnto_wasm.js apps/web/public/wasm/bnto_wasm_bg.wasm engine/catalog.snapshot.json packages/@bnto/nodes/src/generated/
      stage_fixed: true

    rust-test:
      glob: "engine/**/*.{rs,toml}"
      run: cd engine && cargo test --workspace

    prettier:
      glob: "*.{ts,tsx,js,mjs,json,css,md,yml,yaml}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    lint:
      glob: "*.{ts,tsx,js,mjs}"
      exclude: "^(archive/|engine/|node_modules/|\\.next)"
      run: pnpm turbo run lint

    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm turbo run build

    dead-code:
      glob: "*.{ts,tsx}"
      run: pnpm knip --no-progress

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # v1.0.0, v2.3.1
      - "v[0-9]+.[0-9]+.[0-9]+-*" # v1.0.0-beta.1, v1.0.0-rc.1

permissions:
  contents: write # Required for softprops/action-gh-release to create releases

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false # Never cancel a release in progress

jobs:
  # ── Job 0: Detect what changed since the last tag ──
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      web: ${{ steps.filter.outputs.web }}
      convex: ${{ steps.filter.outputs.convex }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for tag comparison

      # A stable tag must equal the engine release version, or crates.io
      # silently skips every crate as "already exists" while the site ships.
      - name: Check the tag matches the engine release version
        run: ./scripts/check-release-version.sh "$GITHUB_REF_NAME"

      # Same for crates with their own version: a changed tonkotsu still on a
      # published version left v0.17.0's bnto unable to publish.
      - name: Install Rust toolchain (engine/rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: Check crates with their own version were bumped
        run: ./scripts/check-own-version-crates.sh

      - name: Determine changed surfaces
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Baseline = the last stable release that actually shipped (has a
          # published GitHub Release), not merely the previous tag: a tag whose
          # release gate failed deployed and published nothing, so diffing
          # against it would hide everything it never shipped.
          PREV_TAG=$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 \
            --json tagName -q '.[].tagName' | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous shipped release found — running full pipeline"
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "convex=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing $PREV_TAG..$GITHUB_REF_NAME"
          CHANGED=$(git diff --name-only "$PREV_TAG"..HEAD)
          echo "$CHANGED"

          engine=$(echo "$CHANGED" | grep -q '^engine/' && echo true || echo false)
          # Engine changes reach the web app through the WASM bundle.
          web=$(echo "$CHANGED" | grep -qE '^(apps/|packages/|engine/)' && echo true || echo false)
          convex=$(echo "$CHANGED" | grep -q '^packages/@bnto/backend/convex/' && echo true || echo false)

          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "convex=$convex" >> "$GITHUB_OUTPUT"

          echo "Outputs: engine=$engine web=$web convex=$convex"

          echo "### Change Detection" >> "$GITHUB_STEP_SUMMARY"
          echo "- Engine: $engine" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: $web" >> "$GITHUB_STEP_SUMMARY"
          echo "- Convex: $convex" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 1a: Rust CI (fmt + lint + unit + WASM) ──
  rust:
    name: Rust Engine (fmt + lint + test + WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5

      # Version, components and targets all come from engine/rust-toolchain.toml
      # (the single source of truth); rustup installs whatever it pins.
      - name: Install Rust toolchain (engine/rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Production code only (no --all-targets), so tests are exempt. Functions
      # over 20 lines carry #[expect(clippy::too_many_lines)] until they're split.
      - name: Function length
        run: cargo clippy --workspace -- -W clippy::too_many_lines -D warnings

      - name: Unit tests (native)
        run: cargo test --workspace --exclude bnto

      - name: CLI tests (unit + golden)
        run: cargo test --package bnto

      - name: WASM integration tests (bnto-wasm)
        run: wasm-pack test --node crates/bnto-wasm

      - name: WASM integration tests (bnto-spreadsheet)
        run: wasm-pack test --node crates/bnto-spreadsheet

      - name: WASM integration tests (bnto-file)
        run: wasm-pack test --node crates/bnto-file

      - name: WASM integration tests (bnto-image)
        run: wasm-pack test --node crates/bnto-image

      # Production serves this bundle, not the committed one: the lefthook
      # pre-commit commits a dev build, so the release builds its own.
      - name: Build release WASM bundle for the web app
        run: wasm-pack build --target web --release crates/bnto-wasm

      - name: Upload release WASM bundle
        uses: actions/upload-artifact@v6
        with:
          name: web-wasm
          path: |
            engine/crates/bnto-wasm/pkg/bnto_wasm_bg.wasm
            engine/crates/bnto-wasm/pkg/bnto_wasm.js
          if-no-files-found: error
          retention-days: 7

  # ── Job 1a (Windows): Rust CI (fmt + lint + test) ──
  # Mirrors ci.yml's rust-windows job. Like the Linux job above, it always
  # runs on a release (no change detection) and the gate always requires it.
  rust-windows:
    name: "Rust Engine (Windows: fmt + lint + test)"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5

      # Version, components and targets all come from engine/rust-toolchain.toml
      # (the single source of truth); rustup installs whatever it pins.
      - name: Install Rust toolchain (engine/rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Production code only (no --all-targets), so tests are exempt. Functions
      # over 20 lines carry #[expect(clippy::too_many_lines)] until they're split.
      - name: Function length
        run: cargo clippy --workspace -- -W clippy::too_many_lines -D warnings

      - name: Tests
        run: cargo test --workspace

  # ── Job 1b: TypeScript CI (build + lint + test) ──
  typescript:
    name: TypeScript (build + lint + test)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every workspace package, as in ci.yml's TypeScript job.
      - name: Build (type-check all packages)
        run: pnpm turbo run build

      - name: Lint
        run: pnpm turbo run lint

      - name: Test
        run: pnpm turbo run test

  # ── Gate: all required CI checks must pass ──
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [detect-changes, rust, rust-windows, typescript]
    if: always()
    steps:
      - name: Check job results
        run: |
          rust="${{ needs.rust.result }}"
          rust_windows="${{ needs.rust-windows.result }}"
          ts="${{ needs.typescript.result }}"
          web="${{ needs.detect-changes.outputs.web }}"
          detect="${{ needs.detect-changes.result }}"

          # Change detection is always required. If it fails, the web flag is
          # empty and the TypeScript check below would read its skip as
          # "web unchanged" and pass.
          if [ "$detect" != "success" ]; then
            echo "Detect Changes failed: $detect"
            exit 1
          fi

          if [ "$rust" != "success" ]; then
            echo "Rust CI failed: $rust"
            exit 1
          fi

          if [ "$rust_windows" != "success" ]; then
            echo "Rust CI (Windows) failed: $rust_windows"
            exit 1
          fi

          # TypeScript is only required when web files changed
          if [ "$web" = "true" ] && [ "$ts" != "success" ]; then
            echo "TypeScript CI failed: $ts"
            exit 1
          fi

          echo "CI Gate passed (Rust: $rust, Rust Windows: $rust_windows, TypeScript: $ts, web_changed: $web)"

  # ── Job 2: Deploy Vercel Preview (web changes only) ──
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [detect-changes, ci-gate, rust]
    if: needs.detect-changes.outputs.web == 'true'
    outputs:
      preview-url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Use the release-built WASM bundle
        uses: actions/download-artifact@v7
        with:
          name: web-wasm
          path: apps/web/public/wasm

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for preview to be ready
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" \
              "$url")
            if [ "$status" = "200" ]; then
              echo "Preview is ready at $url"
              exit 0
            fi
            echo "Attempt $i: status $status, waiting..."
            sleep 5
          done
          echo "Preview not ready after 150 seconds"
          exit 1

  # ── Job 3: E2E Tests against Preview (web changes only) ──
  e2e-tests:
    name: E2E Tests (Preview)
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-preview]
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests against preview
        run: pnpm exec playwright test --project=browser --max-failures=3
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.preview-url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-report-${{ github.ref_name }}
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-results-${{ github.ref_name }}
          path: apps/web/test-results/
          retention-days: 14

  # ── Job 4: Lighthouse audit against Preview (web changes only) ──
  lighthouse:
    name: Lighthouse (Preview)
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-preview]
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Lighthouse config for preview
        run: pnpm exec tsx scripts/generate-lighthouserc.ts --base-url ${{ needs.deploy-preview.outputs.preview-url }}
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_BUILD_CONTEXT__EXTERNAL_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ── Job 5: Release Gate ──
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [detect-changes, ci-gate, deploy-preview, e2e-tests, lighthouse]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          web="${{ needs.detect-changes.outputs.web }}"

          # CI Gate is always required
          if [ "${{ needs.ci-gate.result }}" != "success" ]; then
            echo "FAILED: CI Gate = ${{ needs.ci-gate.result }}"
            exit 1
          fi

          # Web jobs are only required when web files changed
          if [ "$web" = "true" ]; then
            failed=0
            for job in deploy-preview e2e-tests lighthouse; do
              result="${{ needs[job].result }}"
              # GitHub Actions doesn't support dynamic needs access, check each explicitly
            done

            if [ "${{ needs.deploy-preview.result }}" != "success" ]; then
              echo "FAILED: Deploy Preview = ${{ needs.deploy-preview.result }}"
              exit 1
            fi
            if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
              echo "FAILED: E2E Tests = ${{ needs.e2e-tests.result }}"
              exit 1
            fi
            if [ "${{ needs.lighthouse.result }}" != "success" ]; then
              echo "FAILED: Lighthouse = ${{ needs.lighthouse.result }}"
              exit 1
            fi
          fi

          echo "Release gate passed."
          echo "  CI Gate:    ${{ needs.ci-gate.result }}"
          echo "  Preview:    ${{ needs.deploy-preview.result }}"
          echo "  E2E Tests:  ${{ needs.e2e-tests.result }}"
          echo "  Lighthouse: ${{ needs.lighthouse.result }}"
          echo "  Web changed: $web"

  # ── Job 6: Deploy to Production (Vercel, web changes only) ──
  deploy-production:
    name: Deploy to Production (Vercel)
    runs-on: ubuntu-latest
    needs: [detect-changes, release-gate, rust]
    if: always() && needs.release-gate.result == 'success' && needs.detect-changes.outputs.web == 'true' && !contains(github.ref_name, '-')
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Use the release-built WASM bundle
        uses: actions/download-artifact@v7
        with:
          name: web-wasm
          path: apps/web/public/wasm

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Write IndexNow verification file
        if: env.INDEXNOW_KEY != ''
        run: echo "$INDEXNOW_KEY" > apps/web/public/${INDEXNOW_KEY}.txt
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ── Job 7: Deploy Convex to Production (convex changes only) ──
  convex-deploy:
    name: Convex Deploy (prod)
    runs-on: ubuntu-latest
    needs: [detect-changes, release-gate]
    if: always() && needs.release-gate.result == 'success' && needs.detect-changes.outputs.convex == 'true' && !contains(github.ref_name, '-')
    defaults:
      run:
        working-directory: packages/@bnto/backend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Deploy Convex functions to production
        run: npx convex deploy --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  # ── Job 8: Publish to crates.io (engine changes only) ──
  cargo-publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [detect-changes, release-gate]
    if: always() && needs.release-gate.result == 'success' && needs.detect-changes.outputs.engine == 'true' && !contains(github.ref_name, '-')
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5

      # Version, components and targets all come from engine/rust-toolchain.toml
      # (the single source of truth); rustup installs whatever it pins.
      - name: Install Rust toolchain (engine/rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Publish crates (dependency order, skip already-published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish() {
            local crate=$1
            echo "Publishing $crate..."
            local output
            output=$(cargo publish -p "$crate" 2>&1) && return 0
            if echo "$output" | grep -q 'already exists'; then
              echo "$crate already published, skipping."
              return 0
            fi
            echo "$output" >&2
            return 1
          }
          # Layer 0: no deps
          publish bnto-core
          sleep 15

          # Layer 1: depends on bnto-core only
          publish bnto-encode
          publish bnto-spreadsheet
          publish bnto-file
          publish bnto-shell
          sleep 15

          # Layer 2: depends on bnto-core + bnto-encode
          publish bnto-vector
          sleep 15

          # Layer 3: depends on bnto-core + bnto-encode + bnto-vector
          publish bnto-image
          sleep 15

          # Standalone (no bnto deps)
          publish tonkotsu
          sleep 15

          # Layer 4: depends on all node crates
          publish bnto-engine
          sleep 15

          # CLI binary: depends on bnto-engine + tonkotsu
          publish bnto

  # ── Job 9: Notify Search Engines (after production deploy) ──
  notify-search-engines:
    name: Notify Search Engines
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && needs.deploy-production.result == 'success'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Submit to IndexNow
        if: env.INDEXNOW_KEY != ''
        run: pnpm exec tsx scripts/seo/submitIndexNow.ts
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Submit to Google Indexing API
        if: env.GOOGLE_INDEXING_KEY != ''
        run: pnpm exec tsx scripts/seo/submitGoogleIndexing.ts
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}

      - name: Summary
        if: always()
        run: |
          echo "### Search Engine Notifications" >> "$GITHUB_STEP_SUMMARY"
          echo "- IndexNow: submitted or skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Google Indexing API: submitted or skipped" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 10: Create GitHub Release ──
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [detect-changes, release-gate, deploy-production, convex-deploy, cargo-publish]
    if: |
      always() &&
      needs.release-gate.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - name: Summarize deploy results
        id: summary
        run: |
          vercel="${{ needs.deploy-production.result }}"
          convex="${{ needs.convex-deploy.result }}"
          cargo="${{ needs.cargo-publish.result }}"

          # Map results to human-readable status
          status() {
            case "$1" in
              success) echo "Deployed" ;;
              skipped) echo "Skipped (no changes)" ;;
              *) echo "Skipped (pre-release)" ;;
            esac
          }

          echo "vercel=$(status "$vercel")" >> "$GITHUB_OUTPUT"
          echo "convex=$(status "$convex")" >> "$GITHUB_OUTPUT"
          echo "cargo=$(status "$cargo")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Deployed

            - Vercel: ${{ steps.summary.outputs.vercel }}
            - Convex: ${{ steps.summary.outputs.convex }}
            - crates.io: ${{ steps.summary.outputs.cargo }}

            ## Surfaces

            - Engine changed: ${{ needs.detect-changes.outputs.engine }}
            - Web changed: ${{ needs.detect-changes.outputs.web }}
            - Convex changed: ${{ needs.detect-changes.outputs.convex }}

            ---
            Auto-generated from tag `${{ github.ref_name }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect what changed to skip irrelevant jobs ──
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # A change to this workflow runs the jobs it could break.
            engine:
              - 'engine/**'
              - 'recipes/**'
              - '.github/workflows/ci.yml'
            web:
              - '.github/workflows/ci.yml'
              - 'apps/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              # The TypeScript job's task graph and package list.
              - 'turbo.json'
              - 'pnpm-workspace.yaml'

  # ── Rust CI (only when engine files changed) ──
  rust:
    name: Rust Engine (fmt + lint + test + WASM)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.engine == 'true'
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5

      # Version, components and targets all come from engine/rust-toolchain.toml
      # (the single source of truth); rustup installs whatever it pins.
      - name: Install Rust toolchain (engine/rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Production code only (no --all-targets), so tests are exempt. Functions
      # over 20 lines carry #[expect(clippy::too_many_lines)] until they're split.
      - name: Function length
        run: cargo clippy --workspace -- -W clippy::too_many_lines -D warnings

      # A fixed ShellCheck, so a runner-image update can't change what the
      # bundled-script lint finds. /usr/local/bin comes before the image's
      # copy in PATH. To bump: change the version and the checksum together.
      - name: Install ShellCheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: ${SHELLCHECK_VERSION#v}"

      - name: Unit tests (native)
        run: cargo test --workspace --exclude bnto
        env:
          # Fail rather than skip the bundled-script lint
          # (bnto-engine/tests/bundled_scripts.rs).
          BNTO_REQUIRE_SHELLCHECK: "1"

      # keep-awake's Linux tests hold a real systemd-inhibit sleep lock. polkit
      # allows that only from a login session, which a runner isn't in, so
      # grant it to the runner user here (CI only) and require the round trip.
      - name: Let the CLI tests hold a sleep inhibitor
        run: |
          sudo mkdir -p /etc/polkit-1/rules.d
          echo 'polkit.addRule(function (action, subject) { if (action.id == "org.freedesktop.login1.inhibit-block-sleep" && subject.user == "'"$USER"'") return polkit.Result.YES; });' \
            | sudo tee /etc/polkit-1/rules.d/50-bnto-ci.rules
          systemd-inhibit --what=sleep --who=bnto-ci --why=probe --mode=block true

      - name: CLI tests (unit + golden)
        run: cargo test --package bnto
        env:
          # ubuntu-latest ships pwsh; fail rather than skip the PowerShell
          # script-mode specs (bnto/tests/shell_security/powershell_mode.rs).
          BNTO_REQUIRE_PWSH: "1"
          # The keep-awake round trip must really hold a sleep lock.
          BNTO_REQUIRE_KEEP_AWAKE: "1"

      # The TUI's quality gate, like the web's E2E suite: screen snapshots
      # plus journeys driving the real `bnto tui` in a pseudo-terminal. Already
      # run above; repeated by name so a TUI failure reads as one
      # (.claude/strategy/tui-testing.md).
      - name: TUI tests (snapshots + journeys)
        run: |
          cargo test --package bnto --bin bnto screen_snapshots
          cargo test --package bnto --test tui_journeys

      # Dogfood recipes run on the bnto binary the CLI tests just built, so an
      # engine change that breaks one fails here.
      - name: Check dogfood recipes (recipes/)
        run: ./target/debug/bnto check ../recipes/

      # code-standards.md's 400-production-line cap for Rust files.
      - name: Rust file size (recipes/rust-file-size.bnto.json)
        working-directory: .
        run: ./engine/target/debug/bnto run recipes/rust-file-size.bnto.json --yes

      # gotchas.md: no made-up absolute paths like "/nonexistent" in engine
      # code (C:\nonexistent on Windows, which can exist).
      - name: Made-up paths (recipes/nonexistent-paths.bnto.json)
        working-directory: .
        run: ./engine/target/debug/bnto run recipes/nonexistent-paths.bnto.json --yes

      - name: WASM integration tests (bnto-wasm)
        run: wasm-pack test --node crates/bnto-wasm

      - name: WASM integration tests (bnto-spreadsheet)
        run: wasm-pack test --node crates/bnto-spreadsheet

      - name: WASM integration tests (bnto-file)
        run: wasm-pack test --node crates/bnto-file

      - name: WASM integration tests (bnto-image)
        run: wasm-pack test --node crates/bnto-image

  # ── Rust CI on Windows (only when engine files changed) ──
  rust-windows:
    name: "Rust Engine (Windows: fmt + lint + test)"
    runs-on: windows-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.engine == 'true'
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5

      # Version, components and targets all come from engine/rust-toolchain.toml
      # (the single source of truth); rustup installs whatever it pins.
      - name: Install Rust toolchain (engine/rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Production code only (no --all-targets), so tests are exempt. Functions
      # over 20 lines carry #[expect(clippy::too_many_lines)] until they're split.
      - name: Function length
        run: cargo clippy --workspace -- -W clippy::too_many_lines -D warnings

      - name: Tests
        run: cargo test --workspace
        env:
          # windows-latest ships powershell and pwsh; the PowerShell
          # script-mode specs must run, not skip.
          BNTO_REQUIRE_PWSH: "1"
          # ...and PSScriptAnalyzer, which lints bundled PowerShell scripts
          # (bnto-engine/tests/bundled_powershell.rs).
          BNTO_REQUIRE_PSSCRIPTANALYZER: "1"

  # keep-awake's macOS branch drives caffeinate and osascript, so its round
  # trips (bnto/tests/keep_awake.rs) only run on a Mac. Free on a public repo.
  rust-macos-keep-awake:
    name: "keep-awake (macOS)"
    runs-on: macos-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.engine == 'true'
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (engine/rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: keep-awake round trips
        run: cargo test --package bnto --test keep_awake

  # The web's assets, checked by dogfood recipes: the size budget and the
  # unused-asset check. A web change can add an asset and an engine change
  # can break a recipe, so it runs on either. Needs a built bnto, which the
  # TypeScript job doesn't have.
  web-assets:
    name: "Web assets (size budget + unused)"
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.engine == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (engine/rust-toolchain.toml)
        working-directory: engine
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build bnto
        working-directory: engine
        run: cargo build --package bnto

      - name: Size budgets (recipes/size-budget.bnto.json)
        run: ./engine/target/debug/bnto run recipes/size-budget.bnto.json

      # --yes: the reference search is a shell step, and CI can't answer consent.
      - name: Unused assets (recipes/unused-assets.bnto.json)
        run: ./engine/target/debug/bnto run recipes/unused-assets.bnto.json --yes

  # ── TypeScript CI (only when web files changed) ──
  typescript:
    name: TypeScript (build + lint + test)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.web == 'true'
    env:
      NEXT_PUBLIC_CONVEX_URL: https://zealous-canary-422.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://zealous-canary-422.convex.site
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every workspace package, the same commands `task check` runs. Turbo
      # finds the packages and orders them, so a new one can't be left out
      # of a hand-written list. On Actions, each package's output is a
      # collapsible group named after its task (`@bnto/i18n:test`). Test
      # re-runs no build: it replays the build step's results from Turbo's
      # local cache.

      - name: Build (type-check all packages)
        run: pnpm turbo run build

      # --- Monorepo hygiene ---

      - name: "Check: sherif (package.json consistency)"
        run: pnpm sherif -p @bnto/package.json

      - name: "Check: Turbo lint inputs (scripts/turbo/checkLintInputs.ts)"
        run: pnpm exec tsx --test scripts/turbo/missingLintInputs.test.ts && pnpm exec tsx scripts/turbo/checkLintInputs.ts

      - name: Lint
        run: pnpm turbo run lint

      - name: Test
        run: pnpm turbo run test

  # ── Documentation completeness ──
  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: pnpm exec tsx scripts/validate-docs.ts

  # ── Validate release workflow matches workspace crates ──
  crate-publish-check:
    name: Crate Publish List
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate crate publish list
        run: ./scripts/check-crate-publish-list.sh
      - name: Install Rust toolchain (engine/rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      # A crate with its own version (tonkotsu) that changed must be bumped,
      # or the release skips it and whatever uses the change fails to publish.
      - name: Check crates with their own version were bumped
        run: ./scripts/check-own-version-crates.sh

  # Gate job — single status check for branch protection.
  # Accepts skipped jobs when their surface didn't change.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        rust,
        rust-windows,
        rust-macos-keep-awake,
        web-assets,
        typescript,
        crate-publish-check,
        docs,
      ]
    if: always()
    steps:
      - name: Check job results
        run: |
          detect="${{ needs.detect-changes.result }}"
          rust="${{ needs.rust.result }}"
          rust_windows="${{ needs.rust-windows.result }}"
          rust_macos="${{ needs.rust-macos-keep-awake.result }}"
          assets="${{ needs.web-assets.result }}"
          ts="${{ needs.typescript.result }}"
          crates="${{ needs.crate-publish-check.result }}"
          docs="${{ needs.docs.result }}"
          engine="${{ needs.detect-changes.outputs.engine }}"
          web="${{ needs.detect-changes.outputs.web }}"

          failed=0

          # Change detection is always required. If it fails, the engine/web
          # flags are empty, every surface job skips, and the checks below
          # would read those skips as "nothing changed" and pass.
          if [ "$detect" != "success" ]; then
            echo "FAILED: Detect Changes = $detect"
            failed=1
          fi

          # Documentation validation is always required
          if [ "$docs" != "success" ]; then
            echo "FAILED: Documentation Validation = $docs"
            failed=1
          fi

          # Crate publish list is always required
          if [ "$crates" != "success" ]; then
            echo "FAILED: Crate Publish List = $crates"
            failed=1
          fi

          # Rust is required when engine files changed
          if [ "$engine" = "true" ] && [ "$rust" != "success" ]; then
            echo "FAILED: Rust Engine = $rust (engine files changed)"
            failed=1
          fi

          # Windows Rust is required when engine files changed
          if [ "$engine" = "true" ] && [ "$rust_windows" != "success" ]; then
            echo "FAILED: Rust Engine (Windows) = $rust_windows (engine files changed)"
            failed=1
          fi

          if [ "$engine" = "true" ] && [ "$rust_macos" != "success" ]; then
            echo "FAILED: keep-awake (macOS) = $rust_macos (engine files changed)"
            failed=1
          fi

          if { [ "$web" = "true" ] || [ "$engine" = "true" ]; } && [ "$assets" != "success" ]; then
            echo "FAILED: Web assets = $assets (web or engine files changed)"
            failed=1
          fi

          # TypeScript is required when web files changed
          if [ "$web" = "true" ] && [ "$ts" != "success" ]; then
            echo "FAILED: TypeScript = $ts (web files changed)"
            failed=1
          fi

          if [ "$failed" = "1" ]; then
            exit 1
          fi

          echo "CI Gate passed."
          echo "  Detect:     $detect"
          echo "  Docs:       $docs"
          echo "  Crates:     $crates"
          echo "  Rust:       $rust (engine_changed: $engine)"
          echo "  Rust (Win): $rust_windows (engine_changed: $engine)"
          echo "  macOS:      $rust_macos (engine_changed: $engine)"
          echo "  Assets:     $assets"
          echo "  TypeScript: $ts (web_changed: $web)"

  # NOTE: Convex production deploy moved to release.yml (runs after release gate passes).
  # Convex functions only deploy to prod when a release tag is pushed and all checks pass.

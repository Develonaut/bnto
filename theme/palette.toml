# Shared Motorway Palette — Single Source of Truth
#
# This file defines all semantic color tokens for the bnto design system.
# A codegen script (scripts/generate-theme.ts) reads this TOML and produces:
#   - apps/web/app/theme-colors.generated.css   (OKLCH values for web)
#   - engine/crates/bnto/src/tui/palette.rs      (RGB values for terminal)
#
# DO NOT define shadows, surfaces, fonts, radius, or animations here.
# Those are target-specific and live in theme.css / theme.rs respectively.

[meta]
version = "1.0.0"

# ══════════════════════════════════════════════════════════════════════

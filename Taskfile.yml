version: "3"

vars:
  # The CLI built from this checkout (`task cli:build`). Dogfood recipes in
  # recipes/ run with it, so they exercise the engine as it is here.
  BNTO: engine/target/fast/bnto{{exeExt}}

tasks:
  # Frontend tasks
  ui:build:
    desc: Build all frontend packages
    cmds: [pnpm turbo run build]

  ui:dev:
    desc: Start the web app in dev mode (port 4000)
    cmds: [pnpm --filter @bnto/web dev]

  dev:
    desc: Start all dev servers (Next.js on port 4000 + Convex)
    cmds: [pnpm turbo run dev]

  ui:test:
    desc: Run all frontend tests
    cmds: [pnpm turbo run test]

  ui:lint:
    desc: Lint all frontend packages
    cmds: [pnpm turbo run lint]

  # Core integration tests (requires task dev running)
  core:integration:
    desc: Run @bnto/core integration tests against real Convex dev
    cmds: [pnpm --filter @bnto/core test:integration]

  # Quality gate
  check:
    desc: Run all quality checks (Rust + TypeScript)
    cmds:
      - echo "=== rust lint ==="
      - task: wasm:lint
      - echo "=== rust tests (unit + WASM integration) ==="
      - task: wasm:test
      - echo "=== cli tests ==="
      - task: cli:test
      - echo "=== tui snapshots + journeys ==="
      - task: tui:test
      - echo "=== typescript build ==="
      - task: ui:build
      - echo "=== typescript tests ==="
      - task: ui:test
      - echo "=== typescript lint ==="
      - task: ui:lint
      - echo "=== turbo cache inputs ==="
      - task: check:turbo-inputs
      # Runs every scripts/ test, the Lighthouse config's among them.
      - echo "=== scripts/ lint + tests ==="
      - task: check:scripts
      - echo "=== crate publish checks ==="
      - task: check:crates
      - echo "=== theme codegen check ==="
      - task: theme:check
      - echo "=== docs validation ==="
      - task: docs:validate
      - echo "=== dogfood recipes ==="
      - task: check:recipes
      - task: check:budgets
      - task: check:assets
      - task: check:rust-size
      - task: check:nonexistent-paths
      - task: check:extension-splits
      - echo "=== all checks passed ==="

  # CLI tasks (engine/crates/bnto)
  cli:tui:
    desc: Build and launch the TUI (dev mode, uses latest local changes)
    dir: ./engine
    cmds:
      - cargo run --package bnto -- tui {{.CLI_ARGS}}

  form:demo:
    desc: Build and launch the tonkotsu kitchen-sink demo TUI
    dir: ./engine
    cmds:
      - cargo run --package tonkotsu --bin tonkotsu-demo

  cli:build:
    desc: Build the native CLI binary (fast profile for local development)
    dir: ./engine
    cmds:
      - cargo build --profile fast --package bnto

  cli:build:release:
    desc: Build the native CLI binary (release, size-optimized for shipping/CI)
    dir: ./engine
    cmds:
      - cargo build --release --package bnto

  cli:test:
    desc: Run CLI unit + integration + golden tests
    dir: ./engine
    cmds:
      - cargo test --package bnto

  cli:golden:
    desc: Run CLI golden tests only (byte-exact output verification)
    dir: ./engine
    cmds:
      - cargo test --package bnto -- golden

  cli:golden:bless:
    desc: Regenerate golden files from current CLI output
    dir: ./engine
    cmds:
      - BLESS=1 cargo test --package bnto -- golden

  tui:test:
    desc: TUI checks — screen snapshots + journeys in a real pseudo-terminal
    dir: ./engine
    cmds:
      - cargo test --package bnto --bin bnto screen_snapshots
      - cargo test --package bnto --test tui_journeys

  tui:snapshots:
    desc: Check TUI screen snapshots (engine/crates/bnto/src/tui/snapshots)
    dir: ./engine
    cmds:
      - cargo test --package bnto --bin bnto screen_snapshots

  tui:snapshots:update:
    desc: Rewrite TUI screen snapshots from current output (review with git diff)
    dir: ./engine
    cmds:
      - INSTA_UPDATE=always cargo test --package bnto --bin bnto screen_snapshots

  # Documentation validation
  docs:validate:
    desc: Validate crate READMEs, node docs and every relative Markdown link
    cmds:
      - pnpm exec tsx --test scripts/docs/brokenLinks.test.ts
      - pnpm exec tsx scripts/validate-docs.ts

  # Turbo cache inputs (ISS-9)
  check:turbo-inputs:
    desc: Fail naming every Turbo lint, test or build task that doesn't hash a file outside its package that its sources import
    cmds:
      - pnpm exec tsx --test scripts/turbo/missingTaskInputs.test.ts scripts/turbo/taskEntries.test.ts
      - pnpm exec tsx scripts/turbo/checkTaskInputs.ts

  check:lighthouse-config:
    desc: Test the Lighthouse config generator (a free port the server and the audited URLs share)
    cmds: [pnpm exec tsx --test scripts/generate-lighthouserc.test.ts]

  # The repo's own scripts/ (ISS-65, ISS-54): no workspace package lints or tests them
  check:scripts:
    desc: Lint scripts/ (root eslint.config.mjs) and run every scripts/**/*.test.ts
    cmds:
      - pnpm exec eslint scripts
      # Quoted, so Node expands the glob, not the shell (a shell without
      # globstar reads `**` as `*` and misses the tests directly in scripts/).
      - pnpm exec tsx --test 'scripts/**/*.test.ts'

  check:crates:
    desc: CI's Crate Publish List checks — release.yml publishes every crate, and own-version crates (tonkotsu) were bumped when changed
    cmds:
      - ./scripts/check-crate-publish-list.sh
      # Needs network: it compares with the version on crates.io (skips with a warning offline).
      - ./scripts/check-own-version-crates.sh

  # Dogfood recipes (recipes/): repo chores done by bnto itself
  check:recipes:
    desc: Check every recipe in recipes/ without running it
    deps: [cli:build]
    cmds: ["{{.BNTO}} check recipes/"]

  check:budgets:
    desc: Fail naming every web asset over its size budget (WASM bundle 6 MB, other public files 512 KB)
    deps: [cli:build]
    cmds: ["{{.BNTO}} run recipes/size-budget.bnto.json"]

  check:assets:
    desc: Fail naming every file in apps/web/public that nothing in the web app or its UI packages references
    deps: [cli:build]
    # --yes: the recipe's reference search is a shell step, and Task can't answer consent.
    cmds: ["{{.BNTO}} run recipes/unused-assets.bnto.json --yes"]

  check:rust-size:
    desc: Fail naming every Rust source file over 400 production lines (code-standards.md)
    deps: [cli:build]
    # --yes: the line count is a shell step, and Task can't answer consent.
    cmds: ["{{.BNTO}} run recipes/rust-file-size.bnto.json --yes"]

  check:nonexistent-paths:
    desc: Fail naming every engine Rust line that points at a made-up absolute path like "/nonexistent" (gotchas.md)
    deps: [cli:build]
    # --yes: the search is a shell step, and Task can't answer consent.
    cmds: ["{{.BNTO}} run recipes/nonexistent-paths.bnto.json --yes"]

  check:extension-splits:
    desc: Fail naming every engine Rust line outside bnto-core that splits a name on its last dot itself (ISS-33)
    deps: [cli:build]
    # --yes: the search is a shell step, and Task can't answer consent.
    cmds: ["{{.BNTO}} run recipes/extension-splits.bnto.json --yes"]

  check:grab-bags:
    desc: "Fail naming every utils/helpers/hooks.ts(x) file: the ones given (task check:grab-bags -- <files>), else the staged ones"
    deps: [cli:build]
    cmds:
      - |
        files="{{.CLI_ARGS}}"
        [ -n "$files" ] || files=$(git diff --cached --name-only --diff-filter=d -- '*.ts' '*.tsx' ':(exclude,glob)**/e2e/**')
        if [ -n "$files" ]; then
          {{.BNTO}} run recipes/grab-bags.bnto.json $files
        else
          echo "No TypeScript files to check"
        fi

  assets:favicons:
    desc: Regenerate the PNG favicons from apps/web/public/favicon/favicon.svg
    deps: [cli:build]
    cmds:
      - "{{.BNTO}} run recipes/favicons.bnto.json apps/web/public/favicon/favicon.svg -o apps/web/public/favicon"

  # README recipe table codegen (registry → README.md)
  readme:generate:
    desc: Update README.md recipe table from @bnto/registry
    cmds:
      - pnpm exec tsx packages/@bnto/registry/scripts/generate-readme-recipes.ts

  # Node codegen (engine → TypeScript)
  nodes:generate:
    desc: Generate TypeScript node definitions from engine catalog snapshot
    cmds:
      - pnpm exec tsx packages/@bnto/nodes/scripts/generate-from-catalog.ts
      - npx prettier --write "packages/@bnto/nodes/src/generated/**/*.ts"

  nodes:export-types:
    desc: Export document-shape TypeScript types from Rust via ts-rs
    dir: ./engine
    cmds:
      # Uses ts-rs derives gated behind bnto-core's `ts` feature. Each struct
      # has an auto-generated `export_bindings_*` test that writes one file into
      # packages/@bnto/nodes/src/generated/definitionTypes/.
      - cargo test -p bnto-core --features ts export_bindings_
      - cd .. && npx prettier --write "packages/@bnto/nodes/src/generated/definitionTypes/**/*.ts"

  # Theme codegen (palette.toml → CSS + Rust)
  theme:generate:
    desc: Generate CSS + Rust palette from theme/palette.toml
    cmds:
      - pnpm exec tsx scripts/generate-theme.ts

  theme:check:
    desc: Verify generated theme files match palette.toml (CI)
    cmds:
      - pnpm exec tsx scripts/generate-theme.ts --check

  # E2E tests (two-stage: browser parallel, editor serial)
  e2e:
    desc: Run all E2E tests (browser parallel, then editor serial)
    dir: ./apps/web
    cmds:
      - pnpm exec playwright test --project=browser
      - pnpm exec playwright test --project=editor --workers=1

  e2e:browser:
    desc: Run non-editor E2E tests in parallel
    dir: ./apps/web
    cmds: [pnpm exec playwright test --project=browser]

  e2e:editor:
    desc: Run editor E2E tests serially (avoids ReactFlow render contention)
    dir: ./apps/web
    cmds: [pnpm exec playwright test --project=editor --workers=1]

  # SEO audit
  seo:audit:
    desc: Run Lighthouse CI audit locally against all public routes
    # The config picks a free port for the server, so audits in several
    # checkouts can run at once. It's generated after the build, just before
    # lhci starts the server, to keep the window in which something else
    # could take the port to a second or two.
    cmds:
      - task: check:lighthouse-config
      - pnpm --filter @bnto/web build
      - pnpm exec tsx scripts/generate-lighthouserc.ts --with-server
      - pnpm --filter @bnto/web exec lhci autorun --config=../../lighthouserc.json --collect.numberOfRuns=1

  # SEO search engine notifications
  seo:index-now:
    desc: Submit URLs to IndexNow endpoints (Bing, Yandex)
    cmds: [pnpm exec tsx scripts/seo/submitIndexNow.ts]

  seo:submit-google:
    desc: Submit URLs to Google Indexing API
    cmds: [pnpm exec tsx scripts/seo/submitGoogleIndexing.ts]

  seo:submit-all:
    desc: Run all search engine notifications (IndexNow + Google)
    cmds:
      - task: seo:index-now
      - task: seo:submit-google

  # E2E account cleanup
  e2e:cleanup:
    desc: Delete ephemeral E2E test accounts from Convex
    dir: ./packages/@bnto/backend
    cmds:
      - npx convex run _dev_cleanup:cleanTestAccounts

  # R2 dev cleanup
  r2:cleanup-dev:
    desc: Purge all objects from the dev R2 transit bucket
    dir: ./packages/@bnto/backend
    cmds:
      - npx convex run cleanup:purgeAll '{}'

  # WASM tasks (engine/)
  wasm:build:
    desc: Build WASM entry point via wasm-pack (release, web target)
    dir: ./engine
    cmds:
      # Only the cdylib entry point crate (bnto-wasm) gets wasm-pack built.
      # Node crates (bnto-image, etc.) are rlib — they compile into the
      # entry point's .wasm binary, not as separate modules.
      - wasm-pack build --target web --release crates/bnto-wasm

  wasm:build:dev:
    desc: Build WASM entry point in dev mode (faster, larger binary, better errors)
    dir: ./engine
    cmds:
      - wasm-pack build --target web --dev crates/bnto-wasm

  wasm:test:
    desc: Run Rust unit tests (native) + WASM integration tests (Node.js)
    dir: ./engine
    cmds:
      - cargo test --workspace
      - wasm-pack test --node crates/bnto-wasm
      - wasm-pack test --node crates/bnto-spreadsheet
      - wasm-pack test --node crates/bnto-file
      - wasm-pack test --node crates/bnto-image

  wasm:test:unit:
    desc: Run Rust unit tests only (native, fast)
    dir: ./engine
    cmds:
      - cargo test --workspace

  wasm:lint:
    desc: Run clippy (Rust linter) on all WASM crates
    dir: ./engine
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings
      # Function length, production code only (tests are exempt).
      - cargo clippy --workspace -- -W clippy::too_many_lines -D warnings

  wasm:fmt:
    desc: Format all Rust code
    dir: ./engine
    cmds:
      - cargo fmt --all

  wasm:fmt:check:
    desc: Check Rust formatting without changes (CI)
    dir: ./engine
    cmds:
      - cargo fmt --all -- --check

  wasm:copy:
    desc: Copy WASM build output to web app public directory
    cmds:
      - cp engine/crates/bnto-wasm/pkg/bnto_wasm_bg.wasm apps/web/public/wasm/bnto_wasm_bg.wasm
      - cp engine/crates/bnto-wasm/pkg/bnto_wasm.js apps/web/public/wasm/bnto_wasm.js

  wasm:snapshot:
    desc: Generate catalog.snapshot.json from engine registry
    dir: ./engine
    cmds:
      - cargo test --package bnto-wasm generate_catalog_snapshot -- --ignored --nocapture

  wasm:codegen:
    desc: Full engine codegen pipeline (build WASM + snapshot + export types + generate TS catalog)
    cmds:
      - task: wasm:build
      - task: wasm:copy
      - task: wasm:snapshot
      - task: nodes:export-types
      - task: nodes:generate

  nodes:codegen:
    desc: Regenerate the catalog snapshot and TS node files from the engine, without building WASM (for pre-commit hooks)
    cmds:
      - task: wasm:snapshot
      - task: nodes:export-types
      - task: nodes:generate

  wasm:deploy:
    desc: Build WASM and copy to web app (full pipeline)
    cmds:
      - task: wasm:build
      - task: wasm:copy

  wasm:bench:
    desc: Run Criterion benchmarks (results in engine/target/criterion/)
    dir: ./engine
    cmds:
      - cargo bench

  wasm:clean:
    desc: Clean all Rust build artifacts
    dir: ./engine
    cmds:
      - cargo clean

  # Cache management
  clean:cache:
    desc: Clear all build caches (Turbo, Next.js, wasm-pack)
    cmds:
      - rm -rf .turbo
      - rm -rf apps/web/.next
      - rm -rf node_modules/.cache
      - rm -rf ~/Library/Caches/.wasm-pack
      - echo "All caches cleared"

  clean:cache:prune:
    desc: Prune Turbo cache entries older than 7 days
    cmds:
      - find .turbo -type f -mtime +7 -delete 2>/dev/null; find .turbo -type d -empty -delete 2>/dev/null; echo "Pruned Turbo cache (entries older than 7 days)"

  # Release
  version:bump:
    desc: "Set the engine release version every bnto crate shares (e.g., task version:bump -- 0.17.0)"
    cmds:
      - ./scripts/bump-version.sh {{.CLI_ARGS}}

  release:tag:
    desc: "Create a release tag on main (e.g., task release:tag -- v1.0.0)"
    cmds:
      - |
        TAG="{{.CLI_ARGS}}"
        if [ -z "$TAG" ]; then
          echo "Usage: task release:tag -- v1.0.0"
          exit 1
        fi
        echo "Tagging main as $TAG..."
        git checkout main
        git pull origin main
        ./scripts/check-release-version.sh "$TAG"
        git tag "$TAG"
        git push origin "$TAG"
        echo "Tag $TAG pushed. Release workflow will start shortly."
        echo "Watch progress: https://github.com/bntoio/bnto/actions"
        echo "When it finishes: task release:verify -- ${TAG#v}"

  release:verify:
    desc: "Check a release shipped: crates.io, the GitHub Release and www.bnto.io (e.g., task release:verify -- 1.0.0)"
    deps: [cli:build]
    # --yes: the checks are shell steps, and Task can't answer consent.
    cmds: ["{{.BNTO}} run recipes/release-verify.bnto.json --yes -p version={{.CLI_ARGS}}"]

  # Cross-cutting
  build:all:
    desc: Build everything (Rust + TypeScript + CLI)
    cmds:
      - task: wasm:build
      - task: cli:build
      - task: ui:build

  test:all:
    desc: Test everything (Rust + TypeScript + CLI)
    cmds:
      - task: wasm:test
      - task: cli:test
      - task: ui:test

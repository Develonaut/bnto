# Bnto Engine — Cargo Workspace Root

[workspace]
members = [
    "crates/bnto",
    "crates/bnto-core",
    "crates/bnto-encode",
    "crates/bnto-spreadsheet",
    "crates/bnto-engine",
    "crates/bnto-file",
    "crates/bnto-image",
    "crates/bnto-vector",
    "crates/bnto-shell",
    "crates/bnto-wasm",
    "crates/tonkotsu",
]
resolver = "2"

# Package metadata shared by every crate (`<field>.workspace = true`).
[workspace.package]
# The release version: every bnto crate inherits it, and a stable release tag
# must match it (scripts/check-release-version.sh), so the site, crates.io and
# `bnto --version` show one number. Bump with `task version:bump -- X.Y.Z`.
version = "0.18.1"
# Minimum supported Rust version for `cargo install bnto` and library users.
# This is the oldest compiler the code builds on, not the toolchain CI and
# contributors use (that's pinned in rust-toolchain.toml). Raise it when code
# starts using a newer std API, e.g. bnto-vector's `as_chunks_mut` (1.88).
rust-version = "1.88"

# Shared dependency versions — crates reference these with `{ workspace = true }`.
[workspace.dependencies]
# Workspace crates. Their `version` is the release version above;
# `task version:bump` moves them together. tonkotsu is versioned on its own.
bnto-core = { path = "crates/bnto-core", version = "0.18.1" }
bnto-encode = { path = "crates/bnto-encode", version = "0.18.1" }
bnto-spreadsheet = { path = "crates/bnto-spreadsheet", version = "0.18.1" }
bnto-file = { path = "crates/bnto-file", version = "0.18.1" }
bnto-image = { path = "crates/bnto-image", version = "0.18.1" }
bnto-vector = { path = "crates/bnto-vector", version = "0.18.1" }
bnto-shell = { path = "crates/bnto-shell", version = "0.18.1" }
bnto-engine = { path = "crates/bnto-engine", version = "0.18.1" }
tonkotsu = { path = "crates/tonkotsu", version = "0.1.3" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-test = "0.3"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
csv = "1.3"
sha2 = "0.10"
regex = "1"
same-file = "1"
# Set a copied file's modification time (file-copy `newer` mode); unsupported on wasm32 (never called there).
filetime = "0.2.29"
unicode-normalization = "0.1"
# Low-level PNG encoder for writing indexed (8-bit palette) PNGs after color quantization.
# The `image` crate always writes truecolor — we need `png` directly for palette-based output.
png = "0.18"
base64 = "0.22"
colored = "3"
crossterm = "0.29"
indicatif = "0.17"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
dirs = "6"
# canonicalize() without the Windows verbatim prefix, for user-facing paths.
dunce = "1"
ureq = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
# Child-process lifecycle: libc for process-group kill(2), windows-sys for
# Job Objects (the Windows tree kill), ctrlc for SIGINT/SIGTERM handlers that
# terminate spawned command trees on exit. windows-sys 0.61 matches the copy
# clap, ctrlc, dirs and tempfile already pull in.
libc = "0.2"
windows-sys = "0.61"
ctrlc = { version = "3", features = ["termination"] }
# TypeScript binding generator. Used by bnto-core to emit document-shape types
# (Definition, Edge, Port, etc.) to `packages/@bnto/nodes/src/generated/` so
# the Rust engine is the single source of truth for the `.bnto.json` shape.
# Feature-gated via bnto-core's `ts` feature — zero cost in release builds.
ts-rs = "12"
# Text snapshots of rendered TUI screens (dev-only; ratatui's recommended
# pairing with TestBackend). Review changes with `cargo insta review`.
insta = { version = "1", features = ["filters"] }
# TUI journey tests (dev-only): run the real `bnto tui` in a pseudo-terminal
# (ConPTY on Windows) and read its screen through a VT100 emulator.
portable-pty = "0.9"
vt100 = "0.18"

# --- Build Profiles ---

[profile.release]
# Optimize for binary size — WASM files are downloaded by the browser.
opt-level = "s"
# Link-Time Optimization — analyzes all code together, removes unused functions.
lto = true
# Single codegen unit — gives the optimizer more context at the cost of slower compilation.
codegen-units = 1
# Strip debug symbols from final binary.
strip = true

[profile.fast]
# Fast iteration profile for local development.
# Same optimizations as release but trades binary size for compile speed:
# - codegen-units = 16 (parallel LLVM, ~8x faster codegen)
# - thin LTO (cross-crate optimization without the full-LTO cost)
# - opt-level = 2 (speed over size — fine for local use)
# Use via: cargo build --profile fast --package bnto
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16

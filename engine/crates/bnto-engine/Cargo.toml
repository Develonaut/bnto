# bnto-engine — Shared engine layer for CLI + WASM consumers.
# Provides `create_registry()` and `run_pipeline()` so both
# bnto-wasm (browser) and bnto (native CLI) share the same processor
# wiring without duplicating registration code.

[package]
name = "bnto-engine"
version = "0.1.3"
edition = "2024"
description = "Shared engine — registry creation and pipeline convenience for all consumers"
license = "MIT"
repository = "https://github.com/Develonaut/bnto"
homepage = "https://bnto.io"
readme = "README.md"
keywords = ["wasm", "pipeline", "workflow", "processor", "engine"]
categories = ["wasm"]

[lib]
crate-type = ["rlib"]

[dependencies]
bnto-core = { path = "../bnto-core", version = "0.1.2" }
bnto-spreadsheet = { path = "../bnto-spreadsheet", version = "0.1.2" }
bnto-file = { path = "../bnto-file", version = "0.1.2" }
bnto-image = { path = "../bnto-image", version = "0.1.2" }
bnto-vector = { path = "../bnto-vector", version = "0.1.2" }
bnto-video = { path = "../bnto-video", version = "0.1.2", optional = true }
serde_json = { workspace = true }

[dev-dependencies]
base64 = "0.22"

[features]
default = []
native = ["bnto-video"]

# bnto-engine — Shared engine layer for CLI + WASM consumers.
# Provides `create_registry()` and `run_pipeline()` so both
# bnto-wasm (browser) and bnto (native CLI) share the same processor
# wiring without duplicating registration code.

[package]
name = "bnto-engine"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Shared engine — registry creation and pipeline convenience for all consumers"
license = "MIT"
repository = "https://github.com/Develonaut/bnto"
homepage = "https://bnto.io"
readme = "README.md"
keywords = ["wasm", "pipeline", "workflow", "processor", "engine"]
categories = ["wasm"]

[lib]
crate-type = ["rlib"]

[dependencies]
bnto-core = { workspace = true }
bnto-spreadsheet = { workspace = true }
bnto-file = { workspace = true }
bnto-image = { workspace = true }
bnto-vector = { workspace = true }
bnto-shell = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
base64 = "0.22"
filetime = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
native = ["bnto-shell"]

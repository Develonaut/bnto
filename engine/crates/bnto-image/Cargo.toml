# bnto-image — Image processing node crate.
# Provides compress, resize, convert, strip-metadata, and watermark processors.
# Compiles to WASM for browser execution and native for CLI.

[package]
name = "bnto-image"
version = "0.1.2"
edition = "2024"
description = "Image processing node for Bnto WASM engine — compress, resize, convert"
license = "MIT"
repository = "https://github.com/Develonaut/bnto"
homepage = "https://bnto.io"
readme = "README.md"
keywords = ["wasm", "image", "compression", "resize", "browser"]
categories = ["wasm", "multimedia::images"]

# wasm-opt flags — must match ALL features Rust enables by default.
# Rust 1.87+ (LLVM 20) enables 6 post-MVP features for wasm32-unknown-unknown.
# See bnto-wasm/Cargo.toml for full explanation.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]

[lib]
crate-type = ["rlib"]

[dependencies]
bnto-core = { path = "../bnto-core", version = "0.1.2" }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["console"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Image processing — pure Rust codecs (JPEG, PNG, WebP). No C deps.
# CRITICAL: default-features = false disables `rayon` which doesn't work in single-threaded WASM.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = { workspace = true }

# PNG quantization — median cut + Floyd-Steinberg dithering for indexed PNGs.
# This is how we match TinyPNG-level compression (~57% reduction).
quantizr = "1.4"

# Low-level PNG encoder for writing indexed (8-bit palette) output.
# Already a transitive dep of `image`, so zero additional binary size.
png = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

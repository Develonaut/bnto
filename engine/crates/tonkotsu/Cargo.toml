# tonkotsu — Rich terminal forms for ratatui.
# Standalone crate with zero bnto dependency. Provides TextInput, Select,
# Confirm, Number, TextArea, FilePath, and Note field types with pure-function
# state transitions and rendering (returns Vec<Line>, not Widget trait impls).

[package]
name = "tonkotsu"
version = "0.1.0"
edition = "2024"
description = "Rich terminal forms for ratatui — TextInput, Select, Confirm, Number, TextArea, FilePath with pure-function rendering"
license = "MIT"
repository = "https://github.com/Develonaut/bnto"
homepage = "https://bnto.io"
readme = "README.md"
keywords = ["tui", "form", "ratatui", "terminal", "widgets"]
categories = ["command-line-utilities"]

[lib]
crate-type = ["rlib"]

[dependencies]
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-segmentation = "1"

[[bin]]
name = "tonkotsu-demo"
path = "src/bin/demo/main.rs"

[dev-dependencies]

# bnto-file — File operation node crate.
# Provides rename-files processor (patterns, prefix/suffix, find/replace, case transforms).
# Compiles to WASM for browser execution and native for CLI.

[package]
name = "bnto-file"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "File operation nodes for Bnto WASM engine — rename files"
license = "MIT"
repository = "https://github.com/Develonaut/bnto"
homepage = "https://bnto.io"
readme = "README.md"
keywords = ["wasm", "file", "rename", "batch", "browser"]
categories = ["wasm", "filesystem"]

# wasm-opt flags — must match ALL features Rust enables by default.
# Rust 1.87+ (LLVM 20) enables 6 post-MVP features for wasm32-unknown-unknown.
# See bnto-wasm/Cargo.toml for full explanation.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]

[lib]
crate-type = ["rlib"]

[dependencies]
bnto-core = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["console"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
filetime = { workspace = true }
same-file = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
tempfile = { workspace = true }

# Criterion uses Rayon which can't compile for wasm32. Only include for native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "collect_bench"
harness = false

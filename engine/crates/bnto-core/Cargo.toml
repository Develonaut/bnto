# bnto-core — Foundation crate for the Bnto engine.
# Shared types, error definitions, NodeProcessor trait, pipeline orchestrator,
# and progress reporting. All node crates depend on this.

[package]
name = "bnto-core"
version = "0.1.0"
edition = "2024"
description = "Core WASM engine library for Bnto — shared types, traits, and orchestration"
license = "MIT"
repository = "https://github.com/Develonaut/bnto"
homepage = "https://bnto.io"
readme = "README.md"
keywords = ["wasm", "workflow", "pipeline", "automation", "engine"]
categories = ["wasm"]

# wasm-opt flags — must match ALL features Rust enables by default.
# Rust 1.87+ (LLVM 20) enables 6 post-MVP features for wasm32-unknown-unknown.
# See bnto-wasm/Cargo.toml for full explanation.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]

[lib]
crate-type = ["rlib"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

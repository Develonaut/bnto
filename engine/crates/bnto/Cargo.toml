# bnto — Native CLI/TUI for running .bnto.json recipes.
# Binary name: `bnto`
# Uses bnto-engine for shared registry and pipeline execution.

[package]
name = "bnto"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "CLI for running .bnto.json recipes — compress images, clean CSVs, rename files"
license = "MIT"
repository = "https://github.com/Develonaut/bnto"
homepage = "https://bnto.io"
readme = "README.md"
keywords = ["cli", "automation", "workflow", "pipeline", "tool"]
categories = ["command-line-utilities"]

[[bin]]
name = "bnto"
path = "src/main.rs"

[dependencies]
bnto-core = { workspace = true }
bnto-engine = { workspace = true, features = ["native"] }
bnto-file = { workspace = true }
bnto-shell = { workspace = true }
tonkotsu = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
indicatif = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
ctrlc = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
insta = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
csv = { workspace = true }
filetime = { workspace = true }

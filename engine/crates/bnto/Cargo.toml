# bnto — Native CLI/TUI for running .bnto.json recipes.
# Binary name: `bnto`
# Uses bnto-engine for shared registry and pipeline execution.

[package]
name = "bnto"
version = "0.1.5"
edition = "2024"
description = "CLI for running .bnto.json recipes — compress images, clean CSVs, rename files"
license = "MIT"
repository = "https://github.com/Develonaut/bnto"
homepage = "https://bnto.io"
readme = "README.md"
keywords = ["cli", "automation", "workflow", "pipeline", "tool"]
categories = ["command-line-utilities"]

[[bin]]
name = "bnto"
path = "src/main.rs"

[dependencies]
bnto-core = { path = "../bnto-core", version = "0.1.4" }
bnto-engine = { path = "../bnto-engine", version = "0.1.4", features = ["native"] }
bnto-shell = { path = "../bnto-shell", version = "0.1.3" }
tonkotsu = { path = "../tonkotsu", version = "0.1.0" }
clap = { workspace = true }
colored = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
indicatif = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
ctrlc = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
